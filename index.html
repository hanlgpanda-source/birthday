<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mỵ ❤️</title>

<style>
    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#ffeaf3); transition:2s;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hearts{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
}

.heart{
    position:absolute;
    color:#ff4d88;
    font-size:20px;
    animation:float 10s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

.container{
    text-align:center;
    z-index:5;
    position:relative;
}

.tap-text{
    color:#d63384;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
    animation:blink 1.2s infinite;
}

@keyframes blink{
    50%{
        opacity:.4;
    }
}

.gift{
    width:240px;
    height:200px;
    position:relative;
    margin:auto;
    cursor:pointer;
}

.box{
    width:240px;
    height:150px;
    background:#ff5c8a;
    position:absolute;
    bottom:0;
    border-radius:10px;
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

.box::before{
    content:'';
    position:absolute;
    width:35px;
    height:150px;
    background:white;
    left:102px;
}

.lid{
    width:260px;
    height:60px;
    background:#ff85a8;
    position:absolute;
    left:-10px;
    top:0;
    border-radius:10px;
    transform-origin:left center;
    transition:1s;
}

.lid::before{
    content:'';
    position:absolute;
    width:35px;
    height:60px;
    background:white;
    left:112px;
}

.open .lid{
    transform:rotate(-130deg);
}

.content{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    z-index:20;
}



.message{
    max-width:1000px;
    padding:20px;

    font-size:42px;
    font-weight:900;
    line-height:1.6;

    color:#fff8b0;

    -webkit-text-stroke: 1.5px #ff1493;

    text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ff69b4,
        0 0 30px #ff1493,
        0 0 40px #ff1493,
        3px 3px 0 #c2185b;

    animation: glow 2s ease-in-out infinite alternate;
    
}

@keyframes glow{

    from{
        transform:scale(1);
        filter:brightness(1);
    }

    to{
        transform:scale(1.03);
        filter:brightness(1.2);
    }

}
canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
    z-index:15;
}
    #wishRain{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:1;
    pointer-events:none;
}

.wish{
    position:absolute;
    top:-100px;
    color:rgba(255,255,255,0.85);
    font-size:22px;
    font-weight:bold;
    text-shadow:0 0 10px #ff69b4;
    white-space:nowrap;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

.content{
    z-index:20;
}

.container{
    z-index:20;
}
</style>
</head>

<body>
<div id="wishRain">
    
</div>
<div class="hearts" id="hearts"></div>

<canvas id="fireworks"></canvas>

<div class="container">

    <div class="tap-text" id="tapText">
        🎁 Hãy ước nguyện 5 giây và chạm để mở quà! 🎁
    </div>

    <div class="gift" id="gift">
        <div class="lid"></div>
        <div class="box"></div>
    </div>

</div>

<div class="content" id="content">



    <div class="message" id="message"></div>

</div>



<script>

/* TIM BAY */

const hearts = document.getElementById("hearts");

setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(20+Math.random()*30)+"px";

    hearts.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);

},300);


/* MỞ QUÀ */
const wishes = [

"Vạn sự như ý 🌸",
"Thân thể khỏe mạnh 💖",
"Học tập tốt 📚",
"Xinh đẹp hơn ✨",
"Yêu thương nhiều hơn ❤️",
"Love you so much 💕",
"Hạnh phúc mỗi ngày 🌷",
"Luôn mỉm cười 😊",
"Thành công rực rỡ 🌟",
"Bình an và may mắn 🍀",
"Mọi điều tốt đẹp nhất 🎀",
"Ước gì được nấy 🎂",
"Tuổi mới thật tuyệt vời 🎁",
"Niềm vui ngập tràn 💝",
"Luôn được yêu thương 💞"

];

const wishRain = document.getElementById("wishRain");

function createWish(){

    const wish = document.createElement("div");

    wish.className = "wish";

    wish.innerHTML =
        wishes[Math.floor(Math.random()*wishes.length)];

    wish.style.left =
        Math.random()*100 + "%";

    wish.style.fontSize =
        (18 + Math.random()*18) + "px";

    wish.style.animationDuration =
        (8 + Math.random()*8) + "s";

    wishRain.appendChild(wish);

    setTimeout(()=>{
        wish.remove();
    },16000);
}

setInterval(createWish,250);
const gift=document.getElementById("gift");
const content=document.getElementById("content");
const tapText=document.getElementById("tapText");
const song=document.getElementById("song");

gift.addEventListener("click",()=>{

    gift.classList.add("open");
    tapText.style.display="none";


    startFireworks();

    setTimeout(()=>{
        document.querySelector(".container").style.display="none";
        content.style.display="flex";
        document.body.style.background =
"linear-gradient(135deg,#4a0033,#14001f)";
        typeText();
    },1200);

});


/* HIỆU ỨNG GÕ CHỮ */

const text=
"🎂 Chúc Mỵ sinh nhật vui vẻ, tuổi mới luôn xinh đẹp hơn, hạnh phúc hơn, học tập thật tốt, luôn gặp nhiều may mắn và mọi điều đều được như ý nguyện. Love you so much! ❤️";

const message=document.getElementById("message");

let index=0;

function typeText(){

    const typing=setInterval(()=>{

        message.innerHTML+=text.charAt(index);
        index++;

        if(index>=text.length){
            clearInterval(typing);
        }

    },77);
}


/* PHÁO HOA */

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

class Particle{

    constructor(x,y,color){

        this.x=x;
        this.y=y;
        this.color=color;
        this.radius=Math.random()*4+2;

        this.vx=(Math.random()-0.5)*10;
        this.vy=(Math.random()-0.5)*10;

        this.life=100;
    }

    update(){

        this.x+=this.vx;
        this.y+=this.vy;

        this.life--;
    }

    draw(){

        ctx.beginPath();
        ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
        ctx.fillStyle=this.color;
        ctx.fill();
    }
}

function explosion(){

    const colors=[
        "#ff0000",
        "#ffff00",
        "#00ff00",
        "#00ffff",
        "#ff00ff",
        "#ffffff",
        "#ff69b4"
    ];

    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height/2;

    for(let i=0;i<120;i++){

        particles.push(
            new Particle(
                x,
                y,
                colors[Math.floor(Math.random()*colors.length)]
            )
        );
    }
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{

        p.update();
        p.draw();

        if(p.life<=0){
            particles.splice(index,1);
        }

    });

    requestAnimationFrame(animate);
}

animate();

function startFireworks(){

    explosion();

    const interval=setInterval(()=>{
        explosion();
    },500);

    setTimeout(()=>{
        clearInterval(interval);
    },20000);
}

window.addEventListener("resize",()=>{

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

});

</script>

</body>
</html>
